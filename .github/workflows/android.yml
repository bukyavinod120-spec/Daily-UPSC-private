name: Build Daily UPSC APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/dailyupsc/app

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DailyUPSC"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.10' apply false
          }
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.dailyupsc.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.dailyupsc.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:allowBackup="true"
                  android:label="Daily UPSC"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity android:name=".PrivateChatActivity" android:exported="false"/>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/dailyupsc/app/MainActivity.kt << 'EOF'
          package com.dailyupsc.app

          import android.content.Intent
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.MotionEvent
          import android.view.View
          import android.widget.EditText
          import android.widget.TextView
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private var tapCount = 0
              private var lastTap = 0L

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val tv = TextView(this)
                  tv.text = "Daily UPSC\n\nCurrent Affairs Today:\n- NEP 2020 Update\n- Supreme Court Judgement\n- ISRO Aditya L1\n\nDaily Quiz: Article 32 is?"
                  tv.textSize = 18f
                  tv.setPadding(50, 150, 50, 50)
                  setContentView(tv)

                  // Tap 5 times within 3 seconds each -> PIN dialog
                  tv.setOnClickListener {
                      val now = System.currentTimeMillis()
                      if (now - lastTap > 3000) tapCount = 0
                      tapCount++
                      lastTap = now
                      if (tapCount >= 5) {
                          tapCount = 0
                          showPin()
                      }
                  }

                  // Long press (0.75 sec) -> PIN dialog
                  tv.setOnTouchListener(object : View.OnTouchListener {
                      private val handler = Handler(Looper.getMainLooper())
                      private var fired = false
                      private val runner = Runnable {
                          fired = true
                          showPin()
                      }

                      override fun onTouch(v: View?, e: MotionEvent): Boolean {
                          when (e.action) {
                              MotionEvent.ACTION_DOWN -> handler.postDelayed(runner, 750)
                              MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                                  handler.removeCallbacks(runner)
                                  if (fired) {
                                      fired = false
                                      return true
                                  }
                              }
                          }
                          return false
                      }
                  })
              }

              private fun showPin() {
                  val input = EditText(this)
                  AlertDialog.Builder(this)
                      .setTitle("Enter PIN")
                      .setView(input)
                      .setPositiveButton("OK") { _, _ ->
                          if (input.text.toString() == "1234") {
                              startActivity(Intent(this, PrivateChatActivity::class.java))
                          }
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }
          }
          EOF

          cat > app/src/main/java/com/dailyupsc/app/PrivateChatActivity.kt << 'EOF'
          package com.dailyupsc.app

          import android.os.Bundle
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class PrivateChatActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val scroll = ScrollView(this)
                  val layout = LinearLayout(this)
                  layout.orientation = LinearLayout.VERTICAL
                  layout.setPadding(30, 100, 30, 30)

                  val header = TextView(this)
                  header.text = "Private Chat (Offline Mode)"
                  header.textSize = 18f

                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL

                  val input = EditText(this)
                  input.hint = "Type message..."

                  val send = Button(this)
                  send.text = "Send"

                  layout.addView(header)
                  layout.addView(box)
                  layout.addView(input)
                  layout.addView(send)
                  scroll.addView(layout)
                  setContentView(scroll)

                  send.setOnClickListener {
                      val text = input.text.toString()
                      if (text.isEmpty()) return@setOnClickListener
                      val msg = TextView(this)
                      msg.text = "You: $text"
                      msg.setPadding(20, 10, 20, 10)
                      msg.textSize = 16f
                      box.addView(msg)
                      input.setText("")
                  }
              }
          }
          EOF

      - name: Generate Gradle wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          ./gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyUPSC-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
